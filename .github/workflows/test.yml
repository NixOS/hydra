name: "Test"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-systems = ${{ matrix.system }}
    - uses: cachix/cachix-action@v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@v3
    - run: nix-build -A packages.${{ matrix.system }}.hydra-cargo-deps
    - run: nix-build -A checks.${{ matrix.system }}.systemTests

  # NixOS VM tests need KVM, which GitHub only provides on x86_64 runners.
  nixos-tests:
    strategy:
      fail-fast: false
      matrix:
        test:
          - install
          - notifications
          - gitea
          - limits
          - s3-nar-listing
          - s3-nar-listing-presigned
          - s3-overflow
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@v3
    - run: nix-build -A hydraJobs.nixosTests.${{ matrix.test }}.x86_64-linux
