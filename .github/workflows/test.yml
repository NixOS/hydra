name: "Test"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          extra-systems = ${{ matrix.system }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
    - run: nix-build -A packages.${{ matrix.system }}.hydra-cargo-deps
    - run: nix-build -A checks.${{ matrix.system }}.rustTests
    - run: nix-build -A checks.${{ matrix.system }}.systemTests

  # NixOS VM tests need KVM, which GitHub only provides on x86_64 runners.
  nixos-tests:
    strategy:
      fail-fast: false
      matrix:
        test:
          - install
          - notifications
          - gitea
          - limits
          - s3-nar-listing
          - s3-nar-listing-presigned
          - s3-overflow
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
    - run: nix-build -A hydraJobs.nixosTests.${{ matrix.test }}.x86_64-linux
