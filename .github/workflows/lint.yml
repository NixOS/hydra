name: "Lint"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@v3
    - run: nix-build -A checks.x86_64-linux.formatter

  openapi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@v3
    - run: nix-build -A checks.x86_64-linux.validate-openapi

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: hydra-test-cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Mic92/hestia@v3
    - run: nix-build -A checks.x86_64-linux.clippyAll
